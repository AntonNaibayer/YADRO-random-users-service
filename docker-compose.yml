services:
  db:
    image: postgres:16-alpine
    container_name: yadro-random-users-db
    environment:
      POSTGRES_DB: yadro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yadro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: yadro-random-users-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: yadro
      DB_USER: postgres
      DB_PASSWORD: postgres
      BASE_URL: https://api.randomdatatools.ru
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: yadro-random-users-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: